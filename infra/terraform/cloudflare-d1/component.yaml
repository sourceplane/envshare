apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-d1
  description: Provisions the Cloudflare D1 database for stage and prod — the shared documents' read limits and expiries, and the site's counters
  labels:
    domain: infra
    scope: runtime-database

spec:
  type: terraform
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: cloudflare-d1
    terraformDir: terraform
    terraformVersion: "1.15.3"
    repo: envshare
    # SEC-JOB: the wiring document (database id/name) is lease-published
    # post-apply; worker deploys read it back as WIRING_CLOUDFLARE_D1_<ENV>,
    # and db-migrate reads it to find the database it migrates.
    secretOutputs: "WIRING_CLOUDFLARE_D1=wiring"

  # The Cloudflare Terraform provider authenticates via the CLOUDFLARE_API_TOKEN
  # env var, resolved by orun from the project-rung brokered secret — minted
  # fresh per run from the d1-edit template (D1 Write; the workers-deploy token
  # deliberately cannot touch D1). Declared at component level because
  # plan-only lanes refresh against the live Cloudflare API too, not just apply.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://envshare/envshare/{{ .environment }}/CLOUDFLARE_D1_TOKEN"
    # Non-secret connection fact (account-id template).
    CLOUDFLARE_ACCOUNT_ID: "secret://envshare/envshare/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://envshare/envshare/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
